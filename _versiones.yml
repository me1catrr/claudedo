          - {unidad: C9, seccion: c9-1, etiqueta: "C9.1", texto: "Modelos e identificadores vigentes; Fable 5.1 sigue activa", evidencia: "documentación"}
          - {unidad: C9, seccion: c9-2, etiqueta: "C9.2", texto: "Esfuerzo (`output_config.effort`) y sus valores por defecto; `stop_sequence` y `pause_turn`; tabla de precios con caché y lotes", evidencia: "documentación y skill claude-api de 2.1.330"}
