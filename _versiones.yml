# Versiones de la vía C. Fuente única del indicador que muestra scripts/version_unidad.lua.
# Fechas en DD/MM/AAAA. «actualizado» es la edición del texto; «verificacion» la última
# comprobación técnica (puede ser anterior). No marcar «verificado» sin haber ejecutado la comprobación.
# estado: verificado | pendiente de revisión | histórico
#
# curso: edición de ClaudeDo y su historial público. scripts/actualizaciones.lua lo
# muestra en actualizaciones.qmd (con temario.yml para los títulos y las carpetas).
#   claude_code_consultada  última versión publicada cuyo changelog se ha leído
#   claude_code_integrada   versión de la documentación con la que se contrastó el texto
#   claude_code_comprobada  binario con el que se ejecutaron las comprobaciones
#   historial[].cambios     {unidad, seccion (ancla sin #), etiqueta, texto, evidencia}
#                           evidencia: ejecución (binario) · simulación · documentación · changelog
#   historial[].pendientes  lo que queda sin comprobar
# Unidades: claude_code_documentada = versión de la documentación contrastada;
#   claude_code_instalada = binario con el que se ejecutó la última comprobación.
versiones:
  curso:
    version: "0.3.0"
    actualizado: "25/11/2026"
    claude_code_consultada: "2.1.332 (25/11/2026)"
    claude_code_integrada: "2.1.332"
    claude_code_comprobada: "2.1.330 (aplicación de escritorio); ninguna comprobación se declara hecha en 2.1.332"
    modelos: "Claude Fable 5.2, Opus 5.5, Sonnet 5.5 y Haiku 5.5 (documentación del 25/11/2026)"
    historial:
      - version: "0.3.0"
        fecha: "25/11/2026"
        claude_code: "2.1.310 a 2.1.332 (changelog leído; texto contrastado con la documentación vigente)"
