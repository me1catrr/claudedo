          - {unidad: C8, seccion: c8-1, etiqueta: "C8.1", texto: "Códigos de salida de `claude -p` por versión, `--max-turns` fuera de la ayuda, `dontAsk` / `--permission-prompts none` / `denyInsteadOfPrompting`, `/loop` y tareas recurrentes de hasta 30 días; dos ejercicios nuevos", evidencia: "ejecución (2.1.330), documentación y changelog"}
          - {unidad: C8, seccion: c8-2, etiqueta: "C8.2", texto: "Campos `model` y `effort` de los subagentes, `CLAUDE_CODE_SUBAGENT_EFFORT` y `/tasks`; ejercicio nuevo", evidencia: "documentación"}
          - {unidad: C8, seccion: c8-4, etiqueta: "C8.4", texto: "`ExitWorktree` pregunta antes de borrar (2.1.327); `git worktree` fuera del sandbox (2.1.323)", evidencia: "changelog"}
