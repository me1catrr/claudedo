          - {unidad: C4, seccion: c4-3, etiqueta: "C4.3", texto: "Modos vigentes (`default` se muestra como *Manual*, `dontAsk`), modo inicial `auto` en terminal y VS Code, ciclo de Mayús+Tab, reglas `allow` con el `*` en su sitio, *Recently blocked*, `blockWritesOutsideWorkingDirectories` y `denyInsteadOfPrompting`; tres ejercicios nuevos", evidencia: "ejecución (2.1.330) y documentación"}
          - {unidad: C4, seccion: c4-7, etiqueta: "C4.7", texto: "Modelos y alias, migración de Fable 5.1 a `fable` (2.1.321), niveles de esfuerzo y `ultrathink`, ventanas de uso de cinco horas y semanal, retirada del modo rápido de Opus 4.8 (30/11/2026); dos ejercicios nuevos", evidencia: "ejecución (`--effort`, 2.1.330) y documentación"}
