        modelos: "Fable 5.2, Opus 5.5, Sonnet 5.5 y Haiku 5.5"
        resumen: >-
          Actualización integral: las novedades de Claude Code de la 2.1.310 a la 2.1.332 que
          afectan al curso pasan al texto de las unidades (desaparecen las cajas «por
          incorporar»), los modelos y precios se contrastan con la documentación oficial y se
          centralizan en `_variables.yml`, y se abre esta página de actualizaciones.
        cambios:
          - {unidad: C1, seccion: c1-1, etiqueta: "C1.1", texto: "Fable 5.2 sustituye a Fable 5.1 (8 $ / 40 $ por MTok); identificadores, latencia, retiradas y modelos de acceso limitado; ejercicio nuevo sobre identificadores", evidencia: "documentación"}
          - {unidad: C1, seccion: c1-4, etiqueta: "C1.4", texto: "Esfuerzo por defecto de cada modelo y dónde se elige modelo y esfuerzo en la aplicación, Claude Code y la API", evidencia: "documentación"}
          - {unidad: C1, seccion: c1-5, etiqueta: "C1.5", texto: "Claude Code pregunta antes de enviar a la red el correo de la cuenta (2.1.317, ajustado en 2.1.321 y 2.1.325)", evidencia: "changelog"}
          - {unidad: C2, seccion: c2-1, etiqueta: "C2.1", texto: "Warp como otra aplicación de terminal: la Zsh o PowerShell de siempre", evidencia: "documentación"}
          - {unidad: C2, seccion: c2-8, etiqueta: "C2.8", texto: "La extensión de Claude Code en Cursor y otros editores derivados de VS Code (no probado en el curso)", evidencia: "documentación"}
          - {unidad: C2, seccion: c2-9, etiqueta: "C2.9", texto: "Saber qué versión tienes y actualizar según el método de instalación; dos instalaciones en PATH; `claude doctor` con prueba de conectividad (2.1.331) y `claude auth status` con caducidad del inicio de sesión (2.1.318); ejercicio nuevo", evidencia: "ejecución (`--version`, `--help`, 2.1.330), documentación y changelog"}
