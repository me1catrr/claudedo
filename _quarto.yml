project:
  type: website
  # docs/ contiene apuntes de consulta, no páginas ni descargas públicas.
  # _curso/ y _migracion/ son notas de trabajo (el prefijo _ ya las excluye).
  # Los ejemplos _ejemplo/ tampoco se renderizan con el sitio (prefijo _).
  render:
    - "*"
    - "!docs/**"
    - "!descargas/**"
  resources:
    - "!docs/**"
    - descargas/*.txt
  post-render:
    - scripts/no_publicar_docs.ts

# La barra superior y la barra lateral las genera
# scripts/generar_estructura.jl a partir de temario.yml. No editarlas aquí.
# _versiones.yml alimenta el indicador de versión de cada unidad.
metadata-files:
  - _navegacion.yml
  - _versiones.yml

lang: es
bibliography: recursos/bibliografia.bib

# Ejercicios intercalados (scripts/ejercicios.lua), lista final de referencias
# y el indicador de versión bajo el título de cada unidad.
filters:
  - scripts/ejercicios.lua
  - scripts/referencias.lua
  - scripts/version_unidad.lua

website:
  title: "ClaudeDo"
  description: "Aprende Claude haciendo: IA aplicada al trabajo profesional, la programación y la investigación con Claude y Claude Code"
  site-url: https://me1catrr.github.io/claudedo/
  repo-url: https://github.com/me1catrr/claudedo
  repo-actions: [edit, issue]
  favicon: recursos/identidad/fig/marca.svg
  navbar:
    logo: recursos/identidad/fig/marca.svg
    logo-alt: "ClaudeDo"

format:
  html:
    # styles.css es la base común de Resonancia, JuliaDo y ClaudeDo;
    # marca.scss solo cambia el color principal y los acentos de este sitio.
    theme:
      - cosmo
      - marca.scss
    css: styles.css
    grid:
      sidebar-width: 270px
      body-width: 880px
      margin-width: 270px
      gutter-width: 1.5rem
    toc: true
    code-copy: true
    citations-hover: true
    link-citations: true
    reference-section-title: "Referencias"

# Nombres en español de los entornos numerados (def-, thm-, prp-, exm-…).
crossref:
  fig-title: "Figura"
  tbl-title: "Tabla"
  eq-prefix: "ecuación"
  thm-title: "Teorema"
  prp-title: "Proposición"
  def-title: "Definición"
  exm-title: "Ejemplo"
  lem-title: "Lema"
  cor-title: "Corolario"
  thm-prefix: "Teorema"
  prp-prefix: "Proposición"
  def-prefix: "Definición"
  exm-prefix: "Ejemplo"
  lem-prefix: "Lema"
  cor-prefix: "Corolario"

execute:
  freeze: auto
