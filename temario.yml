# =============================================================================
# ClaudeDo — temario (fuente de verdad)
# -----------------------------------------------------------------------------
# Define las unidades del curso: identificador, título, carpeta (slug),
# prerrequisitos, perfiles y temas. La barra lateral y la superior
# (_navegacion.yml) se generan a partir de él con scripts/generar_estructura.jl.
#
# Procede de la vía C de Resonancia (https://github.com/me1catrr/resonancia),
# separada en un sitio propio en noviembre de 2026. Los identificadores C0–C9
# y los slugs se conservan: son rutas públicas.
#
# Convenciones:
#   - Cada unidad lleva `temas` con identificador propio (C4.5).
#   - `requiere`: identificadores de unidades de ClaudeDo en los que se apoya.
#   - `perfil`: itinerarios en los que aparece: mse (estudiante de la
#     asignatura MSE de Resonancia), uco (PDI e investigación), planta
#     (personal de planta).
#   - `python: true`: la unidad lleva ejemplos paralelos en Python.
#   - `areas`: agrupan las unidades en la barra lateral y en la portada sin
#     cambiar sus carpetas. Un área nueva (por ejemplo, IA en ingeniería, en
#     docencia o en investigación) se añade aquí con sus unidades; cada unidad
#     está en exactamente un área (lo comprueba generar_estructura.jl).
#   - La versión de cada unidad y su comprobación técnica están en
#     _versiones.yml (indicador bajo el título, scripts/version_unidad.lua).
#   - `carpeta: "."`: la vía ocupa la raíz del sitio.
# =============================================================================

curso:
  titulo: ClaudeDo
  subtitulo: Aprende Claude haciendo
  responsable: Rafael Castro Triguero
  repositorio: https://github.com/me1catrr/claudedo
  web: https://me1catrr.github.io/claudedo/
  # Enlaces extra de la barra superior (a la izquierda).
  menu:
    - texto: Hoja de consulta
      href: hoja-consulta.qmd
  # Sitios hermanos (barra superior, a la derecha).
  hermanos:
    - texto: Resonancia
      href: https://me1catrr.github.io/resonancia/
    - texto: JuliaDo
      href: https://me1catrr.github.io/juliado/

vias:

  # ---------------------------------------------------------------------------
  - id: C
    titulo: Claude y Claude Code
    carpeta: "."
    descripcion: "Curso de IA aplicada al trabajo profesional, la programación y la investigación. Cada unidad indica la versión de Claude Code con la que se verificó."
    areas:
      - id: fundamental
        titulo: Fundamental
        descripcion: Entender la IA y usar Claude con criterio en el trabajo diario
        unidades: [C0, C1]
      - id: aplicado
        titulo: Aplicado
        descripcion: Terminal, Git, Claude Code, programación y análisis de datos
        unidades: [C2, C3, C4, C5, C6]
      - id: avanzado
        titulo: Avanzado
        descripcion: Personalizar, automatizar, integrar la API y proyectos integradores
        unidades: [C7, C8, C9]
    unidades:

      - id: C0
        titulo: Fluidez en IA, fundamentos e historia
        slug: c0-fluidez
        perfil: [mse, uco, planta]
        temas:
          C0.1: "Breve historia de la IA: de la IA simbólica al aprendizaje automático"
          C0.2: "Redes neuronales, aprendizaje profundo y transformers"
          C0.3: "Cómo funciona un modelo de lenguaje: tokens, contexto y predicción"
          C0.4: "De los asistentes conversacionales a los agentes: LLM, asistente y agente"
          C0.5: "Capacidades y límites: alucinaciones, paquetes inexistentes y referencias inventadas"
          C0.6: "Marco de fluidez: delegar, describir, discernir y actuar con diligencia"
          C0.7: "Privacidad y confidencialidad: RGPD, datos de empresa y de investigación"
          C0.8: Integridad académica y declaración del uso de IA
          C0.9: Uso responsable en la empresa e ingeniería con supervisión humana
          C0.10: Lo que la IA no puede hacer por ti

      - id: C1
        titulo: Claude y el ecosistema Anthropic
        slug: c1-claude-web
        requiere: [C0]
        perfil: [mse, uco, planta]
        temas:
          C1.1: "Anthropic y la evolución de Claude: familias y versiones de modelos, con fecha"
          C1.2: "Interfaces: Claude en web, escritorio y móvil, Claude Code y API"
          C1.3: Conversar con una IA frente a trabajar con un agente de programación
          C1.4: "Elegir modelo; planes, autenticación y facturación"
          C1.5: "Protección de datos: uso personal frente a uso empresarial"
          C1.6: "Introducción al prompting: contexto, ejemplos, formato e iteración"
          C1.7: Proyectos, artefactos y análisis de ficheros
          C1.8: "Tareas tipo: informes, procedimientos, tablas, documentación técnica y planes de trabajo"
          C1.9: Anthropic Academy y otras fuentes oficiales para seguir aprendiendo

      - id: C2
        titulo: Preparación del entorno y terminal
        slug: c2-terminal
        requiere: [C0]
        perfil: [mse, uco, planta]
        temas:
          C2.1: "Terminal, shell y sistema operativo: Zsh y PowerShell, ayuda e historial"
          C2.2: Rutas absolutas y relativas, estructura de carpetas y ficheros ocultos
          C2.3: "Navegación y manejo de ficheros: rutas con espacios, comodines, copias y compresión"
          C2.4: "Texto: búsqueda, filtrado, expresiones regulares, tuberías y redirección"
          C2.5: Variables de entorno y PATH
          C2.6: "Gestores de paquetes e instalación de herramientas: Homebrew y winget"
          C2.7: "Entornos de Python (uv) y proyectos de Julia"
          C2.8: Editor de código, VS Code y alternativas
          C2.9: "Quarto, Git, Claude Code y Docker: instalación y comprobación de versiones"
          C2.10: "Permisos, procesos y scripts: POSIX frente a ACL, señales, parámetros, bucles y códigos de salida"
          C2.11: "Copias y hashes, redes, tareas programadas, logs y diagnóstico; lista de preparación"

      - id: C3
        titulo: Git, GitHub y worktrees
        slug: c3-git
        requiere: [C2]
        perfil: [mse, uco, planta]
        temas:
          C3.1: Historia y fundamentos del control de versiones
          C3.2: "Repositorio, directorio de trabajo, área de preparación y commits"
          C3.3: "Flujo básico: status, add, commit, diff, log y restore"
          C3.4: "Ramas: switch, branch, merge y rebase; resolución de conflictos"
          C3.5: "GitHub: remotos, fetch, pull, push, pull requests y revisión de código"
          C3.6: "Etiquetas y versiones, .gitignore y ficheros grandes"
          C3.7: GitHub Actions y GitHub Pages
          C3.8: "Estrategias de ramas, trabajo en equipo y recuperación de errores"
          C3.9: "Worktrees: concepto, creación, trabajo en paralelo y limpieza"
          C3.10: Worktrees y Claude Code

      - id: C4
        titulo: "Claude Code: fundamentos y trabajo cotidiano"
        slug: c4-claude-code
        requiere: [C1, C2, C3]
        perfil: [mse, uco, planta]
        temas:
          C4.1: "Qué es un agente de programación: arquitectura y bucle de trabajo"
          C4.2: "Instalación, autenticación, actualización y diagnóstico"
          C4.3: Terminal, extensión de VS Code y otras interfaces
          C4.4: "Primera sesión: explorar y preguntar sobre un repositorio"
          C4.5: "Herramientas, permisos y modos de permisos; el modo plan"
          C4.6: "/init y CLAUDE.md: primeros pasos"
          C4.7: "Editar, probar, revisar y hacer commit"
          C4.8: "Sesiones, contexto y compactación; deshacer cambios"
          C4.9: "Modelos, esfuerzo, uso y coste"
          C4.10: "Referencia de comandos: sistema, Git, opciones de la CLI, comandos interactivos y skills"

      - id: C5
        titulo: Programación profesional asistida por IA
        slug: c5-programar
        requiere: [C4]
        perfil: [mse, uco, planta]
        python: true
        temas:
          C5.1: "El ciclo explorar, planificar, implementar, probar, revisar, documentar y commit"
          C5.2: "Prompts técnicos: especificación, restricciones y criterios de aceptación"
          C5.3: "Tests como contrato: desarrollo dirigido por pruebas"
          C5.4: "Depuración, refactorización y revisión de código"
          C5.5: "Arquitectura modular, dependencias, errores, registros y tipos"
          C5.6: "Documentación, rendimiento y seguridad del código"
          C5.7: "Código heredado: migrar de MATLAB a Julia"
          C5.8: Particularidades de Julia y de Python al trabajar con Claude Code
          C5.9: "Cuándo confiar y cuándo verificar a mano; Claude como tutor"

      - id: C6
        titulo: "Excel, datos, Quarto e informes"
        slug: c6-informes
        requiere: [C5]
        perfil: [mse, uco, planta]
        python: true
        temas:
          C6.1: "De Excel a DataFrames y pandas: hojas, rangos y tipos"
          C6.2: "Validación: ausentes, duplicados, formatos y registro de incidencias"
          C6.3: "Transformar y resumir: filtros, agrupaciones, indicadores y estadística descriptiva"
          C6.4: Visualización y comparación entre periodos
          C6.5: Escribir resultados en Excel y CSV
          C6.6: "Informes reproducibles con Quarto: HTML y PDF"
          C6.7: "Paneles de consulta, procesamiento por lotes y tareas recurrentes"
          C6.8: "Laboratorios: ventas, mantenimiento, turnos y vibración"

      - id: C7
        titulo: "Personalización: CLAUDE.md, skills, hooks y MCP"
        slug: c7-extender
        requiere: [C4]
        perfil: [uco, planta]
        temas:
          C7.1: "CLAUDE.md a fondo: jerarquía, ubicaciones, modularidad y mantenimiento"
          C7.2: Memoria y configuración por proyecto y por usuario
          C7.3: "Skills: estructura, SKILL.md, recursos, scripts y pruebas"
          C7.4: Una skill que valida un Excel de indicadores y genera un informe Quarto
          C7.5: "Hooks: eventos, configuración, validación previa y riesgos"
          C7.6: "MCP: arquitectura, clientes, servidores, tools, resources y prompts"
          C7.7: "Un servidor MCP local de solo lectura; MCP frente a un script"
          C7.8: Plugins y distribución
          C7.9: Permisos y seguridad de la configuración

      - id: C8
        titulo: "Automatización, agentes y entornos avanzados"
        slug: c8-automatizar
        requiere: [C7]
        perfil: [uco, planta]
        temas:
          C8.1: Modo no interactivo y automatización repetible
          C8.2: "Subagentes: delegación y orquestación"
          C8.3: Equipos de agentes y coordinación de tareas
          C8.4: "Trabajo en paralelo con worktrees: prevención de conflictos"
          C8.5: "Supervisión, registros, uso, coste e higiene del contexto"
          C8.6: Docker y entornos de desarrollo reproducibles
          C8.7: "Integración continua: Claude Code en GitHub Actions"
          C8.8: "Seguridad: aislamiento, secretos, credenciales y permisos"
          C8.9: "Metodologías de terceros: Get Shit Done (GSD) frente a los flujos nativos"
          C8.10: Un proyecto de análisis de datos con varios agentes

      - id: C9
        titulo: "API, investigación y proyectos integradores"
        slug: c9-api
        requiere: [C5]
        opcional: true
        perfil: [uco]
        python: true
        temas:
          C9.1: "La API de Claude: conceptos, autenticación y SDK"
          C9.2: "Peticiones, parámetros, tokens y coste"
          C9.3: Salidas estructuradas y procesamiento de documentos
          C9.4: "Errores, límites de uso, seguridad y reproducibilidad"
          C9.5: Llamadas desde Python y desde Julia
          C9.6: Evaluación y registro de resultados en investigación
          C9.7: Procesamiento por lotes y automatización de informes científicos
          C9.8: "Proyecto integrador: caso empresarial completo"


itinerarios:
  mse:
    titulo: Estudiante de MSE (Resonancia)
    recorrido: [C0, C2, C3, C4, C5]
  uco:
    titulo: Docente o investigador UCO
    recorrido: [C0-C9]
  planta:
    titulo: Personal de planta
    recorrido: [C0-C8 en versión Windows]
