# Variables del sitio, accesibles con {{< var … >}}.
#
# Colofón de la portada (index.qmd, bloque .creditos), «Acerca de», «Actualizaciones»
# y README (este, a mano).
#
# creacion: periodo en que se redactó el material y versiones de Claude Code usadas.
#   Datos de los registros de sesión del repositorio de origen:
#   2.1.300 el 20-10-2026 (inicio), 2.1.304 del 20 al 23-10 y 2.1.306 el 23-10
#   (redacción de C0–C9) y 2.1.311 el 27 y 28-10. No se conservan los registros
#   del 1 y 2-11 (separación en este repositorio). No se toca.
#
# revision: se actualiza en el mismo commit cada vez que se revisa la web con Claude
#   Code: la fecha y la versión de la sesión (la que muestra /status). Ojo: en la
#   aplicación de escritorio o en la extensión de VS Code puede no coincidir con
#   `claude --version` de la terminal.
#
# claude-code: estado de la última actualización (procedimiento en _curso/ACTUALIZAR.md).
#   consultada   última versión publicada cuyo changelog se ha leído
#   integrada    versión de la documentación con la que se contrastó el texto
#   comprobada   binario con el que se ejecutaron las comprobaciones (puede ser anterior)
#   desde        primera versión cubierta por la actualización
#
# novedades: se conserva por compatibilidad con about.qmd e index.qmd; repite
#   claude-code.consultada y la fecha de lectura.
#
# modelos: datos de los modelos vigentes que cambian (C1, C9 y «Actualizaciones»).
#   Precios en dólares por millón de tokens (MTok) de la API, de la documentación de
#   precios; esfuerzo por defecto y latencia, de la página de modelos.
creacion:
  periodo: "octubre de 2026"
  claude-code: "2.1.300 a 2.1.311"
revision:
  fecha: "25 de noviembre de 2026"
  claude-code: "2.1.330"
claude-code:
  consultada: "2.1.332"
  integrada: "2.1.332"
  comprobada: "2.1.330"
  desde: "2.1.310"
  fecha: "25 de noviembre de 2026"
novedades:
  analizada: "2.1.332"
  desde: "2.1.310"
  fecha: "25 de noviembre de 2026"
modelos:
